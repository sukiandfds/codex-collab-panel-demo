<!doctype html>
<html lang="zh-CN">
  <head>
  <meta charset="UTF-8" />
    <link rel="icon" href="/icons/negus-icon-v2.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/negus-apple-touch-icon-v2.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=negus-4" />
    <link rel="stylesheet" href="/launch.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Negus" />
    <script>
      const navigationEntry = performance.getEntriesByType?.("navigation")[0];
      const navigationType = navigationEntry?.type || (performance.navigation?.type === 1 ? "reload" : "navigate");
      if (navigationType === "reload" || navigationType === "back_forward") {
        document.documentElement.classList.add("negus-skip-launch");
      }
    </script>
    <meta name="description" content="Negus · 随时随地掌控 AI" />
    <title>Negus · 随时随地掌控 AI</title>
    <script>
      if (!navigator.language.toLowerCase().startsWith("zh")) {
        document.documentElement.lang = "en";
        document.title = "Negus · Manage AI Anytime, Anywhere";
        document.querySelector('meta[name="description"]').content = "Negus · Manage AI Anytime, Anywhere";
      }
    </script>
  </head>
  <body>
    <div id="negus-launch" role="status" aria-label="Negus 正在启动" style="display: none">
      <div class="negus-launch-content negus-launch-zh">
        <p class="negus-launch-kicker">为什么选择</p>
        <img class="negus-launch-logo" src="/icons/negus-icon-v2.svg" width="144" height="144" alt="Negus" />
        <p class="negus-launch-copy"><strong>Negus 只为精英提供真正高效的系统，</strong><br />让你随时随地掌控 AI。</p>
      </div>
      <div class="negus-launch-content negus-launch-en">
        <p class="negus-launch-kicker">WHY</p>
        <img class="negus-launch-logo" src="/icons/negus-icon-v2.svg" width="144" height="144" alt="Negus" />
        <p class="negus-launch-copy"><strong>Built for those who lead.</strong><br />Manage AI anytime, anywhere.</p>
      </div>
    </div>
    <script>
      if (!document.documentElement.classList.contains("negus-skip-launch")) {
        document.getElementById("negus-launch").style.removeProperty("display");
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
