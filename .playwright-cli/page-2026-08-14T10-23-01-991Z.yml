                    - text: ：减少对现有代码、数据和运行链路的扰动，降低迁移和回归成本；不是低配实现，也不是删掉完整功能。
                  - listitem [ref=e286]:
                    - strong [ref=e287]: “最佳优化”
                    - text: ：在小范围改动中，优先优化公共能力和长期维护收益；不是为了快而做临时补丁。
